<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JP Business Scanner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

.container {
  width: 92%;
  max-width: 1000px;
  margin: 35px auto;
}

.hero {
  text-align: center;
  margin-bottom: 30px;
}

.hero h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.hero p {
  color: #667085;
  font-size: 17px;
  line-height: 1.6;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.07);
  margin-bottom: 22px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 16px;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  border: none;
  border-radius: 10px;
  background: #111827;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#status {
  text-align: center;
  font-weight: bold;
  margin: 20px 0;
}

#reportArea {
  display: none;
}

.score {
  text-align: center;
  padding: 25px;
}

.scoreNumber {
  font-size: 64px;
  font-weight: bold;
}

.scoreLabel {
  font-size: 18px;
  color: #667085;
}

.sectionTitle {
  font-size: 21px;
  margin-bottom: 15px;
}

.reportBox {
  white-space: pre-wrap;
  line-height: 1.7;
  font-size: 15px;
}

.cta {
  text-align: center;
  background: #111827;
  color: white;
}

.cta h2 {
  margin-top: 0;
}

.cta p {
  color: #d0d5dd;
  line-height: 1.6;
}

.cta button {
  background: white;
  color: #111827;
}

.error {
  color: #b42318;
}

.success {
  color: #067647;
}

@media (max-width: 600px) {

  .container {
    margin: 20px auto;
  }

  .hero h1 {
    font-size: 28px;
  }

  .card {
    padding: 18px;
  }

  .scoreNumber {
    font-size: 52px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">

    <h1>JP Business Scanner</h1>

    <p>
      Discover website problems that may be costing your business
      leads, customers and growth.
    </p>

  </div>

  <div class="card">

    <label for="website">
      Business Website
    </label>

    <input
      id="website"
      type="url"
      placeholder="https://example.com"
    >

    <label for="visitors">
      Monthly Visitors
    </label>

    <input
      id="visitors"
      type="number"
      placeholder="Optional"
    >

    <label for="conversion">
      Current Conversion Rate (%)
    </label>

    <input
      id="conversion"
      type="number"
      step="0.01"
      placeholder="Optional"
    >

    <label for="value">
      Average Customer Value (USD)
    </label>

    <input
      id="value"
      type="number"
      placeholder="Optional"
    >

    <button id="scanButton">
      SCAN WEBSITE
    </button>

  </div>

  <div id="status"></div>

  <div id="reportArea">

    <div class="card score">

      <div class="scoreNumber" id="score">
        --
      </div>

      <div class="scoreLabel">
        Website Growth Score
      </div>

    </div>

    <div class="card">

      <h2 class="sectionTitle">
        Website Growth Report
      </h2>

      <div id="report" class="reportBox"></div>

    </div>

    <div class="card cta">

      <h2>
        Want These Website Problems Fixed?
      </h2>

      <p>
        We can help improve your website's SEO,
        lead generation, conversion opportunities
        and online presence.
      </p>

      <button id="fixButton">
        GET THESE ISSUES FIXED
      </button>

    </div>

  </div>

</div>

<script>

const API_URL =
  "https://jp-business-scanner-v7.emmanueleboh219.workers.dev/";

const scanButton =
  document.getElementById("scanButton");

const status =
  document.getElementById("status");

const reportArea =
  document.getElementById("reportArea");

const report =
  document.getElementById("report");

const score =
  document.getElementById("score");

scanButton.addEventListener(
  "click",
  async function() {

    const website =
      document.getElementById("website")
      .value
      .trim();

    const visitors =
      document.getElementById("visitors")
      .value
      .trim();

    const conversion =
      document.getElementById("conversion")
      .value
      .trim();

    const value =
      document.getElementById("value")
      .value
      .trim();

    if (!website) {

      status.textContent =
        "Please enter a business website.";

      status.className =
        "error";

      return;
    }

    scanButton.disabled = true;

    scanButton.textContent =
      "SCANNING...";

    status.textContent =
      "Analyzing website...";

    status.className = "";

    reportArea.style.display =
      "none";

    try {

      const api =
        new URL(API_URL);

      api.searchParams.set(
        "url",
        website
      );

      if (visitors) {

        api.searchParams.set(
          "visitors",
          visitors
        );

      }

      if (conversion) {

        api.searchParams.set(
          "conversion",
          conversion
        );

      }

      if (value) {

        api.searchParams.set(
          "value",
          value
        );

      }

      const response =
        await fetch(
          api.toString()
        );

      const result =
        await response.text();

      if (!response.ok) {

        throw new Error(result);

      }

      report.textContent =
        result;

      const scoreMatch =
        result.match(
          /OVERALL SCORE\s+(\d+)\/100/
        );

      if (scoreMatch) {

        score.textContent =
          scoreMatch[1] + "/100";

      } else {

        score.textContent =
          "--";

      }

      reportArea.style.display =
        "block";

      status.textContent =
        "SCAN COMPLETE";

      status.className =
        "success";

    } catch (error) {

      status.textContent =
        "Scan failed: " +
        error.message;

      status.className =
        "error";

    } finally {

      scanButton.disabled =
        false;

      scanButton.textContent =
        "SCAN WEBSITE";

    }

  }
);

document.getElementById(
  "fixButton"
).addEventListener(
  "click",
  function() {

    window.location.href =
      "mailto:your@email.com?subject=Website%20Growth%20Fix";

  }
);

</script>

</body>
</html>
